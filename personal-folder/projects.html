<!DOCTYPE html>
<html lang="en-us">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Projects | Mason Tuft</title>
  <meta name="description" content="Browse Mason Tuft's portfolio of mobile, web app, and web design projects.">
  <meta name="author" content="Mason Tuft">
  <meta property="og:title" content="Projects | Mason Tuft">
  <meta property="og:description" content="Browse Mason Tuft's portfolio of mobile, web app, and web design projects.">
  <meta property="og:type" content="website">
  <meta property="og:url" content="https://jmrcycling.github.io/personal-folder/projects.html">
  <meta property="og:image" content="https://jmrcycling.github.io/personal-folder/images/code-snippet.jpg">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="Projects | Mason Tuft">
  <meta name="twitter:description" content="Browse Mason Tuft's portfolio of mobile, web app, and web design projects.">
  <meta name="twitter:image" content="https://jmrcycling.github.io/personal-folder/images/code-snippet.jpg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&family=Roboto:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles/styles.css">
</head>
<body>

  <header>
    <a class="logo" href="index.html">Mason Tuft</a>
    <nav id="mainNav">
      <a href="index.html">Home</a>
      <a href="projects.html">Projects</a>
      <a href="projects.html#contact">Contact Me</a>
    </nav>
    <button class="nav-toggle" id="navToggle" aria-label="Toggle navigation">&#9776;</button>
  </header>

  <!-- Projects -->
  <section class="projects-page">
    <h2>Projects</h2>
    <div class="filter-bar" role="group" aria-label="Filter projects">
      <button class="filter-btn active" data-filter="All">All</button>
      <button class="filter-btn" data-filter="Mobile">Mobile</button>
      <button class="filter-btn" data-filter="Web App">Web App</button>
      <button class="filter-btn" data-filter="Web Design">Web Design</button>
    </div>
    <p class="filter-count" id="filterCount"></p>
    <div class="projects-grid" id="projectsGrid">
      <!-- Rendered by JS -->
    </div>
  </section>

  <!-- Contact -->
  <section id="contact" class="contact">
    <div class="contact-text">
      <h2>Contact Me</h2>
      <p>Interested in working together? Whether you're a recruiter, hiring manager, or small business owner looking for a developer — I'd love to hear from you.</p>
    </div>
    <form class="contact-form" id="contactForm" novalidate>
      <input type="text" id="nameInput" name="name" placeholder="Name" required>
      <span class="field-error" id="nameError"></span>
      <input type="email" id="emailInput" name="email" placeholder="Email" required>
      <span class="field-error" id="emailError"></span>
      <textarea id="messageInput" name="message" placeholder="Message" rows="5" required></textarea>
      <span class="field-error" id="messageError"></span>
      <button type="submit" class="btn">Send</button>
      <p class="form-success" id="formSuccess">Thanks! I'll get back to you soon.</p>
    </form>
  </section>

  <footer>
    <p>&copy; <span id="year"></span> Mason Tuft</p>
  </footer>

  <script src="scripts/main.js" defer></script>
  <script src="scripts/projects.js" defer></script>
</body>
</html>
